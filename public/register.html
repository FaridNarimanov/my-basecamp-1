<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - My Basecamp</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
        }
        .container {
            margin: 0;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: var(--radius);
        }
        .page-title {
            color: var(--primary);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
        }
        label { 
            display: block; 
            text-align: left; 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--text); 
            margin-bottom: 6px; 
        }
        input { margin: 0 0 18px 0; }
        .username-hint { 
            font-size: 12px; 
            color: var(--muted); 
            margin-top: -12px; 
            margin-bottom: 18px; 
            text-align: left; 
        }
        button[type="submit"] { 
            background: var(--accent); 
            margin-top: 10px; 
            padding: 14px;
            font-weight: 600;
            border-radius: 6px;
        }
        button[type="submit"]:hover {
            background: #2563eb;
        }
        .footer-link { 
            margin-top: 20px; 
            font-size: 14px; 
            color: var(--muted); 
            text-align: center;
        }
        .footer-link a { 
            color: var(--accent); 
            font-weight: 500; 
            text-decoration: none; 
        }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container form-container">
        <h2 class="page-title">Register</h2>
        <p class="subtitle">Create your new account</p>

        <div id="msgBox" class="message-box"></div>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>

            <label for="username">Username</label>
            <input type="text" id="username" required pattern="[a-zA-Z0-9_]+" title="Letters, numbers and underscore only">
            <p class="username-hint">Other users will use this to add you to projects.</p>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6">

            <button type="submit">Create Account</button>
        </form>

        <p class="footer-link"><a href="/login">Back to Login</a></p>
    </div>

    <script>
        const msgBox = document.getElementById('msgBox');
        function showMessage(text, isError = false) {
            msgBox.textContent = text;
            msgBox.className = 'message-box ' + (isError ? 'error' : 'success');
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, username, password })
                });
                const result = await response.json();
                if (response.ok) {
                    showMessage('Account created! Redirecting to login...');
                    setTimeout(() => window.location.href = '/login', 1200);
                } else {
                    showMessage(result.message, true);
                }
            } catch {
                showMessage("A system error occurred.", true);
            }
        });
    </script>
</body>
</html>
