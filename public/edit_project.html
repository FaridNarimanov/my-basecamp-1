<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Project</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: var(--bg); display: block !important; }
        .edit-container { max-width: 900px; margin: 40px auto; background: transparent; padding: 0 20px; box-sizing: border-box; }
        
        .top-navbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 30px; }
        .top-navbar a, .top-navbar button { background: none; border: none; color: var(--text); font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; padding: 0; font-family: inherit; }
        .top-navbar a:hover, .top-navbar button:hover { color: var(--accent); }

        .edit-header { margin-bottom: 30px; }
        .edit-header h1 { font-family: inherit; color: var(--primary); margin-bottom: 5px; font-size: 26px; font-weight: 700; }
        .edit-header small { color: var(--muted); font-size: 13px; }
        .creator-link { font-weight: 600; color: var(--accent); text-decoration: none; transition: 0.2s;}
        .creator-link:hover { text-decoration: underline; }
        
        .grid-layout { display: flex; gap: 30px; align-items: flex-start;}
        .left-panel { flex: 3; display: flex; flex-direction: column; gap: 20px; background: var(--card-bg); padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border);}
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; }

        .form-row { display: flex; gap: 15px; align-items: flex-start; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        .input-group label { color: var(--text); margin-bottom: 8px; font-size: 13px; font-weight: 600; }
        
        .update-btn { background-color: var(--accent); color: white; border: none; border-radius: 6px; padding: 0 20px; height: 44px; margin-top: 27px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; white-space: nowrap; }
        .update-btn:hover { background-color: #2563eb; }

        .overview-btn { background-color: var(--card-bg); color: var(--text); text-decoration: none; border-radius: 6px; padding: 12px 15px; font-size: 14px; font-weight: 500; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .overview-btn:hover { background-color: #f3f4f6; color: var(--accent); }
        
        .delete-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--danger); border-radius: 6px; padding: 12px 15px; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; width: 100%; box-shadow: var(--shadow); }
        .delete-btn:hover { background: #fee2e2; border-color: #fca5a5; }

        .member-actions { display: flex; align-items: center; gap: 12px; margin-top: 27px; height: 44px; flex-shrink: 0;}
        
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; margin: 0; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(18px); }

        .add-member-btn { background-color: var(--success); color: white; border: none; border-radius: 6px; height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: 500; }
        .add-member-btn:hover { opacity: 0.9; }

        .member-list-container { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;}
        .member-list-container h3 { font-size: 16px; color: var(--primary); margin: 0 0 15px 0; font-weight: 600;}
        .member-item-edit { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); background: #f9fafb; border-radius: 6px; margin-bottom: 8px;}
        .role-badge { color: white; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-top: 4px; display: inline-block;}
        .role-owner { background-color: var(--danger); }
        .role-admin { background-color: var(--warning); }
        .role-viewer { background-color: var(--accent); }

        .custom-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .custom-modal-content { background-color: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); box-sizing: border-box; }
        .custom-modal-content h3 { margin-top: 0; color: var(--primary); font-size: 20px; margin-bottom: 10px; font-weight: 600;}
        .custom-modal-content p { color: var(--muted); margin-bottom: 25px; font-size: 14px;}
        .filter-btn { background-color: #f3f4f6; border: 1px solid var(--border); padding: 10px 20px; color: var(--text); cursor: pointer; border-radius: 6px; font-weight: 500; transition: 0.2s; font-size: 14px; margin:0;}
        .filter-btn:hover { background-color: #e5e7eb; }
    </style>
</head>
<body>
    <div class="edit-container">
        <div class="top-navbar">
            <a href="/dashboard">← Back to Dashboard</a>
            <div style="display: flex; gap: 20px;">
                <a href="/edit_profile">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profile
                </a>
                <button id="logoutBtn" style="color: var(--text);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </button>
            </div>
        </div>
        
        <div class="edit-header">
            <h1>Settings</h1>
            <small>Created by: <a id="creatorLink" href="#" class="creator-link">Loading...</a></small>
        </div>

        <div class="grid-layout">
            <div class="left-panel">
                <div class="form-row">
                    <div class="input-group">
                        <label>Project Name</label>
                        <input type="text" id="editName">
                    </div>
                    <button id="updateNameBtn" class="update-btn">Update</button>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Description</label>
                        <textarea id="editDesc"></textarea>
                    </div>
                    <button id="updateDescBtn" class="update-btn">Update</button>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label>Add Member (Username)</label>
                        <input type="text" id="memberUsername" placeholder="Enter exact username">
                    </div>
                    <div class="member-actions">
                        <label class="switch">
                            <input type="checkbox" id="isAdminToggle">
                            <span class="slider"></span>
                        </label>
                        <span style="font-size: 13px; font-weight: 600; color: var(--text);">Admin</span>
                        <button id="addMemberBtn" class="add-member-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                            Add Member
                        </button>
                    </div>
                </div>

                <div class="member-list-container">
                    <h3>Current Members</h3>
                    <div id="editMembersList"><p style="color: var(--muted); font-size: 13px;">Loading...</p></div>
                </div>
            </div>

            <div class="right-panel">
                <a id="overviewLink" href="#" class="overview-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    Project Overview
                </a>
                <button id="deleteProjectBtn" class="delete-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Delete Project
                </button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="custom-modal">
        <div class="custom-modal-content">
            <svg id="confirmIcon" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" style="margin-bottom: 15px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <h3 id="confirmTitle">Confirm Action</h3>
            <p id="confirmMessage">Are you sure?</p>
            <div style="display: flex; gap: 10px;">
                <button id="cancelConfirmBtn" class="filter-btn" style="flex: 1;">Cancel</button>
                <button id="executeConfirmBtn" style="background: var(--danger); color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: 500; cursor: pointer;">Yes, Do it</button>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="customAlertModal" class="custom-modal">
        <div class="custom-modal-content">
            <svg id="alertIcon" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" style="margin-bottom: 15px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <h3 id="alertTitle">Alert</h3>
            <p id="alertMessage">Message goes here.</p>
            <button id="closeAlertBtn" style="background: var(--accent); color: white; width: 100%; border: none; padding: 12px; border-radius: 6px; font-weight: 500; cursor: pointer;">OK</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        let currentConfirmAction = null; 

        function showCustomAlert(message, type = 'success', callback = null) {
            const modal = document.getElementById('customAlertModal');
            const msgEl = document.getElementById('alertMessage');
            const iconEl = document.getElementById('alertIcon');
            const titleEl = document.getElementById('alertTitle');
            const btn = document.getElementById('closeAlertBtn');

            msgEl.textContent = message;
            if (type === 'error') { titleEl.textContent = 'Error'; iconEl.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'; iconEl.setAttribute('stroke', 'var(--danger)'); btn.style.background = 'var(--danger)'; } 
            else if (type === 'warning') { titleEl.textContent = 'Warning'; iconEl.innerHTML = '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>'; iconEl.setAttribute('stroke', 'var(--warning)'); btn.style.background = 'var(--warning)'; } 
            else { titleEl.textContent = 'Success'; iconEl.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'; iconEl.setAttribute('stroke', 'var(--success)'); btn.style.background = 'var(--success)'; }

            modal.style.display = 'flex';
            btn.onclick = () => { modal.style.display = 'none'; if (callback) callback(); };
        }

        function showCustomConfirm(title, message, executeFunction) {
            document.getElementById('confirmTitle').textContent = title; document.getElementById('confirmMessage').textContent = message; currentConfirmAction = executeFunction; document.getElementById('confirmModal').style.display = 'flex';
        }

        document.getElementById('cancelConfirmBtn').addEventListener('click', () => { document.getElementById('confirmModal').style.display = 'none'; currentConfirmAction = null; });
        document.getElementById('executeConfirmBtn').addEventListener('click', () => { document.getElementById('confirmModal').style.display = 'none'; if (currentConfirmAction) currentConfirmAction(); });

        async function init() {
            if (!projectId) return window.location.href = '/dashboard';
            document.getElementById('overviewLink').href = `/project?id=${projectId}`;
            try {
                const res = await fetch(`/projects/${projectId}/details`);
                if (!res.ok) throw new Error();
                const project = await res.json();
                document.getElementById('editName').value = project.name;
                document.getElementById('editDesc').value = project.description || '';
                const creatorLink = document.getElementById('creatorLink');
                if (project.creator_username) { creatorLink.innerText = project.creator_username; creatorLink.href = `/user_profile?username=${project.creator_username}`; } 
                else { creatorLink.innerText = project.creator_email; creatorLink.style.pointerEvents = 'none'; creatorLink.style.textDecoration = 'none'; creatorLink.style.color = 'var(--muted)'; }
                loadEditMembers();
            } catch (error) { showCustomAlert("Project not found.", "error", () => { window.location.href = '/dashboard'; }); }
        }

        async function loadEditMembers() {
            const response = await fetch(`/projects/${projectId}/members`);
            const members = await response.json();
            const list = document.getElementById('editMembersList');
            const defaultAvatar = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2JkYzNjNyI+PHBhdGggZD0iTTEyIDEyYzIuMjEgMCA0LTEuNzkgNC00cy0xLjc5LTQtNC00LTQgMS43OS00IDQgMS43OSA0IDQgNHptMCAyYy0yLjY3IDAtOCAxLjM0LTggNHYyaDE2di0yYzAtMi42Ni01LjMzLTQtOC00eiIvPjwvc3ZnPg==';

            list.innerHTML = members.map(m => {
                let roleClass = 'role-viewer';
                if(m.role === 'Owner') roleClass = 'role-owner';
                else if(m.role === 'admin') roleClass = 'role-admin';

                const displayName = m.username ? m.username : m.name;
                const avatarSrc = m.profile_pic ? m.profile_pic : defaultAvatar;
                
                let actionBtnsHtml = '';
                if(m.role !== 'Owner') {
                    const roleActionText = m.role === 'admin' ? 'Make Viewer' : 'Make Admin';
                    const nextRole = m.role === 'admin' ? 'viewer' : 'admin';
                    const roleBtnColor = m.role === 'admin' ? '#9ca3af' : 'var(--accent)'; 

                    actionBtnsHtml = `
                    <div style="display: flex; gap: 8px;">
                        <button onclick="toggleMemberRole('${m.username}', '${nextRole}')" style="background: ${roleBtnColor}; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer;">${roleActionText}</button>
                        <button onclick="confirmRemoveMember('${m.username}')" style="background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer;">Remove</button>
                    </div>`;
                }

                return `
                <div class="member-item-edit">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <img src="${avatarSrc}" alt="Avatar" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border);">
                        <div style="display: flex; flex-direction: column;">
                            <span style="color: var(--text); font-size: 13px; font-weight: 600;">${displayName}</span>
                            <span class="role-badge ${roleClass}">${m.role}</span>
                        </div>
                    </div>
                    ${actionBtnsHtml}
                </div>`;
            }).join('');
        }

        function toggleMemberRole(username, newRole) {
            const actionText = newRole === 'admin' ? 'promote to Admin' : 'demote to Viewer';
            showCustomConfirm('Change Role?', `Are you sure you want to ${actionText} @${username}?`, async () => {
                const res = await fetch(`/projects/${projectId}/members/${username}/role`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role: newRole }) });
                const result = await res.json();
                if(res.ok) { showCustomAlert(result.message, 'success'); loadEditMembers(); } else showCustomAlert(result.message, 'error');
            });
        }

        function confirmRemoveMember(username) {
            showCustomConfirm('Remove Member?', `Are you sure you want to remove @${username} from this project?`, async () => {
                const res = await fetch(`/projects/${projectId}/members/${username}`, { method: 'DELETE' });
                const result = await res.json();
                if(res.ok) { showCustomAlert(result.message, 'success'); loadEditMembers(); } else showCustomAlert(result.message, 'error');
            });
        }

        async function updateProject() {
            const name = document.getElementById('editName').value; const desc = document.getElementById('editDesc').value;
            const res = await fetch(`/projects/${projectId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, description: desc }) });
            if(res.ok) showCustomAlert("Project updated successfully!", "success"); else showCustomAlert("Error updating project.", "error");
        }

        document.getElementById('updateNameBtn').addEventListener('click', updateProject);
        document.getElementById('updateDescBtn').addEventListener('click', updateProject);

        document.getElementById('deleteProjectBtn').addEventListener('click', () => {
            showCustomConfirm('Delete Project?', 'Are you sure you want to permanently delete this project? This action cannot be undone.', async () => {
                await fetch(`/projects/${projectId}`, { method: 'DELETE' }); window.location.href = '/dashboard';
            });
        });

        document.getElementById('addMemberBtn').addEventListener('click', async () => {
            const username = document.getElementById('memberUsername').value.trim(); const isAdmin = document.getElementById('isAdminToggle').checked;
            if(!username) return showCustomAlert("Please enter a username.", "warning");
            const res = await fetch(`/projects/${projectId}/members`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, role: isAdmin ? 'admin' : 'viewer' }) });
            const result = await res.json();
            if(res.ok) { showCustomAlert(result.message, "success"); document.getElementById('memberUsername').value = ''; loadEditMembers(); } else showCustomAlert(result.message, "error");
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => { await fetch('/sessions', { method: 'DELETE' }); window.location.href = '/login'; });
        init();
    </script>
</body>
</html>
