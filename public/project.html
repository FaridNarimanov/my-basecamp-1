<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Details</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="project-page">
    <div class="top-navbar">
        <!-- DÜZƏLİŞ: Geri qayıtmaq oxu SVG ikonla əvəzləndi -->
        <a href="/dashboard" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Dashboard
        </a>
        <div class="nav-actions">
            <a href="/edit_profile" class="project-nav-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Profile
            </a>
            <button id="logoutBtn" class="project-logout-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
            </button>
        </div>
    </div>        

    <div class="project-header-container">
        <h1 id="projectName">Loading...</h1>
        <p id="projectDesc"></p>
    </div>

    <div class="layout">
        <div class="sidebar">
            <button class="sidebar-btn edit" onclick="window.location.href='/edit_project?id=' + projectId">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Manage Project
            </button>
            <button class="sidebar-btn" onclick="document.getElementById('discussionsSection').scrollIntoView()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg>
                Discussions
            </button>
            <button class="sidebar-btn" onclick="document.getElementById('tasksSection').scrollIntoView()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                Tasks
            </button>
            <button class="sidebar-btn" onclick="document.getElementById('membersSection').scrollIntoView()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Members
            </button>
            <button class="sidebar-btn" onclick="document.getElementById('attachmentsSection').scrollIntoView()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                Attachments
            </button>
        </div>

        <div class="main-content">
            
            <div class="section-box" id="discussionsSection">
                <h3><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg> Discussions</h3>
                <div class="input-row">
                    <input type="text" id="newDiscussion" placeholder="Type a message...">
                    <button id="btnDiscussion" class="btn-action-btn">Send</button>
                </div>
                <div id="discussionsList" class="list-min-height list-space-lg"></div>
            </div>

            <div class="section-box" id="tasksSection">
                <h3><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg> Tasks</h3>
                <div class="input-row">
                    <input type="text" id="newTask" placeholder="What needs to be done?">
                    <button id="btnTask" class="btn-action-btn">Add Task</button>
                </div>
                <div id="tasksList" class="list-space-lg"></div>
            </div>

            <div class="section-box" id="membersSection">
                <h3><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Project Members</h3>
                <div id="membersList" class="list-space-md"></div>
            </div>

            <div class="section-box" id="attachmentsSection">
                <h3><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg> Attachments</h3>
                <div class="input-row attachment-dropzone">
                    <div class="attachment-input-wrap">
                        <input type="file" id="newAttachment" class="file-input-hidden">
                        <label for="newAttachment" class="file-label">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            Choose File
                        </label>
                        <span id="fileNameDisplay" class="file-name-display">No file chosen</span>
                    </div>
                    <button id="btnAttachment" class="btn-action-btn btn-upload">Upload</button>
                </div>
                <div id="attachmentsList"></div>
            </div>

        </div>
    </div>

    <!-- Modals -->
    <div id="deleteAttachmentModal" class="custom-modal">
        <div class="custom-modal-content">
            <svg class="modal-icon" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <h3>Delete File?</h3>
            <p>Are you sure you want to delete this file? This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="cancelFileDeleteBtn" class="filter-btn modal-action-btn">Cancel</button>
                <button id="confirmFileDeleteBtn" class="modal-danger-btn">Delete</button>
            </div>
        </div>
    </div>

    <div id="customAlertModal" class="custom-modal">
        <div class="custom-modal-content">
            <svg id="alertIcon" class="modal-icon" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <h3 id="alertTitle">Alert</h3>
            <p id="alertMessage">Message goes here.</p>
            <button id="closeAlertBtn" class="modal-primary-btn">OK</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        let fileToDeleteId = null;

        function showCustomAlert(message, type = 'error', callback = null) {
            const modal = document.getElementById('customAlertModal');
            const msgEl = document.getElementById('alertMessage');
            const iconEl = document.getElementById('alertIcon');
            const titleEl = document.getElementById('alertTitle');
            const btn = document.getElementById('closeAlertBtn');

            msgEl.textContent = message;
            btn.classList.remove('alert-btn-error', 'alert-btn-warning', 'alert-btn-success');
            
            if (type === 'error') {
                titleEl.textContent = 'Error';
                iconEl.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>';
                iconEl.setAttribute('stroke', 'var(--danger)');
                btn.classList.add('alert-btn-error');
            } else if (type === 'warning') {
                titleEl.textContent = 'Warning';
                iconEl.innerHTML = '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>';
                iconEl.setAttribute('stroke', 'var(--warning)');
                btn.classList.add('alert-btn-warning');
            } else {
                titleEl.textContent = 'Success';
                iconEl.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>';
                iconEl.setAttribute('stroke', 'var(--success)');
                btn.classList.add('alert-btn-success');
            }

            modal.style.display = 'flex';
            btn.onclick = () => { modal.style.display = 'none'; if (callback) callback(); };
        }

        async function init() {
            if (!projectId) return window.location.href = '/dashboard';
            await loadProjectDetails();
            await loadDiscussions();
            await loadTasks();
            await loadMembers();
            await loadAttachments();
        }

        async function loadProjectDetails() {
            try {
                const response = await fetch(`/projects/${projectId}`);
                if (!response.ok) throw new Error();
                const project = await response.json();
                document.getElementById('projectName').innerText = project.name;
                document.getElementById('projectDesc').innerText = project.description || 'No description provided.';
            } catch (error) {
                showCustomAlert("Project not found!", "error", () => { window.location.href = '/dashboard'; });
            }
        }

        function timeSince(dateString) {
            const date = new Date(dateString + 'Z'); 
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return "Just now";
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " y ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " mo ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " d ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " h ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " m ago";
        }

        async function loadDiscussions() {
            const response = await fetch(`/projects/${projectId}/discussions`);
            const discussions = await response.json();
            const list = document.getElementById('discussionsList');
            if(discussions.length === 0) { list.innerHTML = '<p class="empty-message">No discussions yet.</p>'; return; }
            
            const defaultAvatar = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2JkYzNjNyI+PHBhdGggZD0iTTEyIDEyYzIuMjEgMCA0LTEuNzkgNC00cy0xLjc5LTQtNC00LTQgMS43OS00IDQgMS43OSA0IDQgNHptMCAyYy0yLjY3IDAtOCAxLjM0LTggNHYyaDE2di0yYzAtMi42Ni01LjMzLTQtOC00eiIvPjwvc3ZnPg==';

            list.innerHTML = discussions.map(d => {
                const avatarSrc = d.profile_pic ? d.profile_pic : defaultAvatar;
                const displayName = d.username ? d.username : d.user_name;
                const profileLink = d.username ? `/user_profile?username=${d.username}` : '#';
                const timeAgo = timeSince(d.created_at);

                return `
                <div class="chat-msg chat-msg-layout">
                    <a href="${profileLink}" class="profile-link-small"><img src="${avatarSrc}" alt="Avatar" class="avatar-small"></a>
                    <div class="chat-body">
                        <div class="chat-meta">
                            <a href="${profileLink}" class="profile-name-link">${displayName}</a>
                            <span class="time-ago">• ${timeAgo}</span>
                        </div>
                        <div class="chat-content">${d.content}</div>
                    </div>
                </div>`;
            }).join('');
        }
        
        document.getElementById('btnDiscussion').addEventListener('click', async () => {
            const input = document.getElementById('newDiscussion');
            if(!input.value.trim()) return;
            await fetch(`/projects/${projectId}/discussions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: input.value }) });
            input.value = '';
            loadDiscussions();
        });

        async function toggleTask(taskId, is_completed) {
            await fetch(`/tasks/${taskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ is_completed }) });
            loadTasks();
        }

        async function loadTasks() {
            const response = await fetch(`/projects/${projectId}/tasks`);
            const tasks = await response.json();
            const list = document.getElementById('tasksList');
            if(tasks.length === 0) { list.innerHTML = '<p class="empty-message">No tasks assigned.</p>'; return; }
            list.innerHTML = tasks.map(t => `
                <div class="task-item">
                    <input type="checkbox" ${t.is_completed ? 'checked' : ''} onchange="toggleTask(${t.id}, this.checked)">
                    <span class="${t.is_completed ? 'done' : ''}">${t.content}</span>
                </div>
            `).join('');
        }
        
        document.getElementById('btnTask').addEventListener('click', async () => {
            const input = document.getElementById('newTask');
            if(!input.value.trim()) return;
            await fetch(`/projects/${projectId}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: input.value }) });
            input.value = '';
            loadTasks();
        });

        async function loadMembers() {
            const response = await fetch(`/projects/${projectId}/members`);
            const members = await response.json();
            const list = document.getElementById('membersList');
            const defaultAvatar = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2JkYzNjNyI+PHBhdGggZD0iTTEyIDEyYzIuMjEgMCA0LTEuNzkgNC00cy0xLjc5LTQtNC00LTQgMS43OS00IDQgMS43OSA0IDQgNHptMCAyYy0yLjY3IDAtOCAxLjM0LTggNHYyaDE2di0yYzAtMi42Ni01LjMzLTQtOC00eiIvPjwvc3ZnPg==';

            list.innerHTML = members.map(m => {
                let roleClass = 'role-viewer';
                if(m.role === 'Owner') roleClass = 'role-owner';
                else if(m.role === 'admin') roleClass = 'role-admin';

                const displayName = m.username ? m.username : m.name;
                const avatarSrc = m.profile_pic ? m.profile_pic : defaultAvatar;
                const profileLink = m.username ? `/user_profile?username=${m.username}` : '#';

                return `
                <a href="${profileLink}" class="profile-link-block">
                    <div class="member-item">
                        <div class="member-info-row">
                            <img src="${avatarSrc}" alt="Avatar" class="avatar-small">
                            <span class="member-name">${displayName}</span>
                        </div>
                        <span class="member-role ${roleClass}">${m.role}</span>
                    </div>
                </a>`;
            }).join('');
        }    

        document.getElementById('newAttachment').addEventListener('change', function() {
            const display = document.getElementById('fileNameDisplay');
            if (this.files && this.files.length > 0) {
                display.textContent = this.files[0].name;
                display.classList.add('has-file');
            } else {
                display.textContent = 'No file chosen';
                display.classList.remove('has-file');
            }
        });

        async function loadAttachments() {
            const response = await fetch(`/projects/${projectId}/attachments`);
            const data = await response.json();
            const list = document.getElementById('attachmentsList');
            
            if(data.attachments.length === 0) { list.innerHTML = '<p class="empty-message">No attachments yet.</p>'; return; }
            const canDelete = data.role === 'owner' || data.role === 'admin';

            list.innerHTML = data.attachments.map(a => {
                const deleteBtn = canDelete ? `<button onclick="triggerFileDelete(${a.id})" class="icon-btn icon-btn-delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>` : '';
                return `
                <div class="member-item attachment-row">
                    <span class="member-name attachment-name">
                        <svg class="attachment-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg> 
                        ${a.file_name}
                    </span>
                    <div class="attachment-actions">
                        <a href="${a.file_path}" download class="icon-btn icon-btn-download">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </a>
                        ${deleteBtn}
                    </div>
                </div>`;
            }).join('');
        }

        function triggerFileDelete(id) { fileToDeleteId = id; document.getElementById('deleteAttachmentModal').style.display = 'flex'; }
        document.getElementById('cancelFileDeleteBtn').addEventListener('click', () => { document.getElementById('deleteAttachmentModal').style.display = 'none'; fileToDeleteId = null; });
        
        document.getElementById('confirmFileDeleteBtn').addEventListener('click', async () => {
            if (fileToDeleteId) {
                const res = await fetch(`/projects/${projectId}/attachments/${fileToDeleteId}`, { method: 'DELETE' });
                document.getElementById('deleteAttachmentModal').style.display = 'none';
                if(res.ok) loadAttachments();
                else { const error = await res.json(); showCustomAlert(error.message || 'Error occurred.', 'error'); }
                fileToDeleteId = null;
            }
        });
        
        document.getElementById('btnAttachment').addEventListener('click', async () => {
            const fileInput = document.getElementById('newAttachment');
            if(!fileInput.files[0]) return showCustomAlert("Please select a file first.", "warning");
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            const res = await fetch(`/projects/${projectId}/attachments`, { method: 'POST', body: formData });
            if (res.ok) { fileInput.value = ''; document.getElementById('fileNameDisplay').textContent = 'No file chosen'; document.getElementById('fileNameDisplay').classList.remove('has-file'); loadAttachments(); }
            else showCustomAlert("Error uploading file.", "error");
        });
        
        document.getElementById('logoutBtn').addEventListener('click', async () => { await fetch('/sessions', { method: 'DELETE' }); window.location.href = '/login'; });
        
        init();
    </script>
</body>
</html>
