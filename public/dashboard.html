<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Projects</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { display: block !important; background-color: var(--bg); margin: 0 !important; padding: 0 !important; }
        .container-fluid { width: 100% !important; max-width: 1200px !important; margin: 0 auto !important; padding: 40px 20px !important; min-height: 100vh; box-sizing: border-box; background: transparent; }
        
        .top-navbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 40px; width: 100%; box-sizing: border-box; }
        .top-navbar .brand { font-weight: 700; color: var(--primary); font-size: 20px; text-transform: uppercase; letter-spacing: 1px;}
        .top-navbar a.nav-link, .top-navbar button.logout-btn { background: none; border: none; color: var(--text); font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; padding: 0; font-family: inherit;}
        .top-navbar a.nav-link:hover { color: var(--accent); }
        .top-navbar .logout-btn:hover { color: var(--danger); }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h1 { color: var(--primary); margin: 0; font-size: 26px; font-weight: 700; }
        .btn-create-modern { background-color: var(--accent); color: white; border: none; border-radius: 6px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
        .btn-create-modern:hover { background-color: #2563eb; transform: translateY(-1px); }
        
        .filter-tabs { display: flex; justify-content: flex-start; gap: 12px; margin-bottom: 30px; }
        .filter-btn { background-color: transparent; border: none; padding: 10px 20px; color: var(--muted); cursor: pointer; border-radius: 8px; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: 0.2s; font-size: 14px; }
        .filter-btn:hover { background-color: #e5e7eb; color: var(--text); }
        .filter-btn.active { background: var(--accent); color: white; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3); }

        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; list-style: none; padding: 0; margin: 0; }
        
        .project-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: all 0.2s ease; cursor: pointer; box-shadow: var(--shadow); }
        .project-card:hover { transform: translateY(-3px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-color: #d1d5db; }
        
        .card-header { padding: 20px 24px 10px 24px; }
        .card-header h3 { margin: 0 0 8px 0; font-size: 18px; color: var(--primary); font-weight: 600; }
        .card-header p { margin: 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .card-body { padding: 10px 24px 20px 24px; flex-grow: 1; color: var(--text); font-size: 14px; line-height: 1.6; }
        .card-footer { background-color: #f9fafb; border-top: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        
        .card-stats { display: flex; gap: 16px; color: var(--muted); font-size: 13px; font-weight: 500; align-items: center;}
        .card-stats span { display: flex; align-items: center; gap: 6px; }
        
        .card-actions { display: flex; gap: 8px; }
        .btn-card-edit, .btn-card-delete { border: none; border-radius: 6px; height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: 600; color: white;}
        .btn-card-edit { background: var(--accent); }
        .btn-card-edit:hover { background: #2563eb; }
        .btn-card-delete { background: var(--danger); }
        .btn-card-delete:hover { background: #dc2626; }

        .custom-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); backdrop-filter: blur(4px); align-items: center; justify-content: center; }
        .custom-modal-content { background-color: #fff; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .custom-modal-content h3 { margin-top: 0; color: var(--primary); font-size: 22px; margin-bottom: 10px; font-weight: 600;}
        .custom-modal-content p { color: var(--muted); margin-bottom: 30px; line-height: 1.5; font-size: 14px;}
        .modal-btn-cancel { background-color: #f3f4f6; color: var(--text); border: 1px solid var(--border); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; transition: 0.2s; }
        .modal-btn-cancel:hover { background-color: #e5e7eb; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="top-navbar">
            <div class="brand">DASHBOARD</div>
            <div style="display: flex; gap: 20px; align-items: center;">
                <a href="/edit_profile" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profile
                </a>
                <button id="logoutBtn" class="logout-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </button>
            </div>
        </div>

        <div class="page-header">
            <h1>Projects</h1>
            <a href="/create_project" class="btn-create-modern">New Project</a>
        </div>

        <div class="filter-tabs">
            <button id="filter-all" class="filter-btn active" onclick="setFilter('all')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                All projects
            </button>
            <button id="filter-owner" class="filter-btn" onclick="setFilter('owner')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                Created by me
            </button>
            <button id="filter-shared" class="filter-btn" onclick="setFilter('shared')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Shared with me
            </button>
        </div>

        <div class="projects-grid" id="projectList"></div>
    </div>

    <!-- Custom Delete Modal -->
    <div id="deleteModal" class="custom-modal">
        <div class="custom-modal-content">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" style="margin-bottom: 20px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <h3>Delete Project?</h3>
            <p>Are you sure you want to permanently delete this project? This action cannot be undone.</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button id="cancelDeleteBtn" class="modal-btn-cancel" style="flex: 1;">Cancel</button>
                <button id="confirmDeleteBtn" class="btn-card-delete" style="margin: 0; flex: 1; border-radius: 6px; height: auto; padding: 10px; font-weight: 600; font-size: 14px; justify-content: center;">Yes, Delete</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="custom-modal">
        <div class="custom-modal-content" style="text-align: left;">
            <h3 style="font-size: 20px; margin-bottom: 20px; font-weight: 600; color: var(--primary);">Quick Edit</h3>
            <input type="hidden" id="editProjectId">
            <div style="margin-bottom: 15px;">
                <label style="display: block; color: var(--text); margin-bottom: 8px; font-size: 13px; font-weight: 500;">Name:</label>
                <input type="text" id="editProjectName" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
            </div>
            <div style="margin-bottom: 25px;">
                <label style="display: block; color: var(--text); margin-bottom: 8px; font-size: 13px; font-weight: 500;">Description:</label>
                <textarea id="editProjectDesc" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; height: 80px; resize: none;"></textarea>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="saveEditBtn" style="background: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; cursor: pointer; font-weight: 500;">Save Changes</button>
                <button id="cancelEditBtn" class="modal-btn-cancel" style="flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/sessions', { method: 'DELETE' });
            window.location.href = '/login';
        });

        let allProjects = [];
        let currentFilter = 'all';
        let projectToDelete = null; 

        async function loadProjects() {
            try {
                const response = await fetch('/projects');
                allProjects = await response.json();
                renderProjects();
            } catch (error) {
                console.error(error);
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('filter-' + filter).classList.add('active');
            renderProjects();
        }

        function renderProjects() {
            const list = document.getElementById('projectList');
            list.innerHTML = '';
            
            const filtered = allProjects.filter(p => currentFilter === 'all' || p.relation === currentFilter);
            
            if(filtered.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: var(--muted); grid-column: 1 / -1; margin-top: 40px; font-size: 15px;">No projects found in this category.</p>';
                return;
            }

            filtered.forEach(p => {
                const isOwner = p.user_role === 'owner';
                const isAdmin = p.user_role === 'admin';
                
                let actionsHtml = '<div></div>';
                
                if (isOwner || isAdmin) {
                    const deleteBtn = isOwner ? `
                        <button class="btn-card-delete" title="Delete Project" onclick="triggerDelete(event, ${p.id})">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    ` : '';

                    actionsHtml = `
                        <div class="card-actions">
                            <button class="btn-card-edit" title="Edit Name/Desc" onclick="openEditModal(event, ${p.id}, '${p.name.replace(/'/g, "\\'")}', '${p.description ? p.description.replace(/'/g, "\\'") : ''}')">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                            ${deleteBtn}
                        </div>
                    `;
                }

                const descText = p.description ? p.description : '<span style="color:#9ca3af; font-style:italic;">No description provided.</span>';

                list.innerHTML += `
                <div class="project-card" onclick="window.location.href='/project?id=${p.id}'">
                    <div class="card-header">
                        <h3>${p.name}</h3>
                        <p>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:5px;"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg> 
                            ${p.creator_email}
                        </p>
                    </div>
                    <div class="card-body">
                        ${descText}
                    </div>
                    <div class="card-footer" onclick="event.stopPropagation()">
                        <div class="card-stats">
                            <span title="Members">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> 
                                ${p.member_count}
                            </span>
                            <span title="Discussions">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg> 
                                ${p.discussion_count}
                            </span>
                        </div>
                        ${actionsHtml}
                    </div>
                </div>
                `;
            });
        }

        function triggerDelete(e, id) {
            e.stopPropagation(); 
            projectToDelete = id;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            document.getElementById('deleteModal').style.display = 'none';
            projectToDelete = null;
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (projectToDelete) {
                await fetch(`/projects/${projectToDelete}`, { method: 'DELETE' });
                document.getElementById('deleteModal').style.display = 'none';
                loadProjects();
            }
        });

        const editModal = document.getElementById('editModal');
        
        function openEditModal(e, id, name, desc) {
            e.stopPropagation(); 
            document.getElementById('editProjectId').value = id;
            document.getElementById('editProjectName').value = name;
            document.getElementById('editProjectDesc').value = desc;
            editModal.style.display = 'flex';
        }

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            editModal.style.display = 'none';
        });

        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            const id = document.getElementById('editProjectId').value;
            const newName = document.getElementById('editProjectName').value;
            const newDesc = document.getElementById('editProjectDesc').value;

            if(!newName || !newDesc) return;

            await fetch(`/projects/${id}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName, description: newDesc })
            });
            
            editModal.style.display = 'none';
            loadProjects();
        });

        loadProjects();
    </script>
</body>
</html>
