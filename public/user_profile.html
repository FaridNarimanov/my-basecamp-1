<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { display: block !important; background-color: var(--bg); }
        
        .container { 
            max-width: 550px; 
            margin: 80px auto; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: var(--radius); 
            border: 1px solid var(--border);
            box-shadow: var(--shadow); 
            box-sizing: border-box; 
        }
        
        /* Tamamilə yeni, unikal class adları (Qlobal CSS təsir etməyəcək) */
        .profile-nav-bar { 
            display: flex; 
            justify-content: flex-start; 
            align-items: center; 
            margin-bottom: 30px; 
        }
        
        .profile-back-btn { 
            color: var(--text); 
            font-size: 14px; 
            font-weight: 500; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            transition: all 0.2s ease; 
            padding: 8px 16px; 
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #f9fafb;
            width: max-content;
        }
        .profile-back-btn:hover { 
            color: var(--primary); 
            background-color: #f3f4f6;
        }

        .profile-card { text-align: center; }
        .avatar-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 20px; background: #f9fafb; }
        .user-name { font-family: inherit; color: var(--primary); font-size: 24px; font-weight: 700; margin: 0 0 5px 0; }
        .user-username { color: var(--accent); font-size: 15px; font-weight: 600; margin: 0 0 20px 0; }
        
        .info-box { background: #f9fafb; border: 1px solid var(--border); padding: 12px 20px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; color: var(--text); font-size: 14px; font-weight: 500; margin-bottom: 10px; min-width: 250px;}
        
        .role-badge { display: inline-block; background-color: var(--primary); color: white; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 25px;}
    </style>
</head>
<body>
    <div class="container">
        <!-- Back navigation -->
        <div class="profile-nav-bar">
            <a href="#" onclick="window.history.back(); return false;" class="profile-back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Back
            </a>
        </div>

        <div class="profile-card" id="profileContent">
            <p style="color: var(--muted); font-size: 14px;">Loading user profile...</p>
        </div>
    </div>

    <script>
        // Extract username from URL parameters (?username=johndoe)
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');
        const defaultAvatar = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2JkYzNjNyI+PHBhdGggZD0iTTEyIDEyYzIuMjEgMCA0LTEuNzkgNC00cy0xLjc5LTQtNC00LTQgMS43OS00IDQgMS43OSA0IDQgNHptMCAyYy0yLjY3IDAtOCAxLjM0LTggNHYyaDE2di0yYzAtMi42Ni01LjMzLTQtOC00eiIvPjwvc3ZnPg==';

        async function loadUserProfile() {
            if (!username) {
                document.getElementById('profileContent').innerHTML = '<h3 style="color: var(--danger);">User not found</h3>';
                return;
            }

            try {
                // Call API
                const response = await fetch(`/api/users/${username}`);
                if (!response.ok) throw new Error('User not found');
                
                const user = await response.json();
                const avatarSrc = user.profile_pic ? user.profile_pic : defaultAvatar;
                const displayName = user.name || 'Unknown User';

                // Render data
                document.getElementById('profileContent').innerHTML = `
                    <img src="${avatarSrc}" alt="Avatar" class="avatar-large">
                    <h1 class="user-name">${displayName}</h1>
                    <p class="user-username">@${user.username}</p>
                    <span class="role-badge">${user.role}</span>
                    
                    <br>
                    <div class="info-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        ${user.email}
                    </div>
                `;
            } catch (error) {
                document.getElementById('profileContent').innerHTML = '<h3 style="color: var(--danger); font-weight: 600;">User not found or does not exist.</h3>';
            }
        }

        loadUserProfile();
    </script>
</body>
</html>
